# cordis.patch.yml — dsh-ai-employee 在安装时被作为 profile bundle 层应用。
#
# 这里只声明一行：把本插件注册成宿主 loader 里的一个 row。
# 浏览器半边由 package.json 的 dsh.client 声明 + lib/client.js 自动发现。
#
# 安装方式（用户手动执行）：
#   cd <本仓库>
#   pnpm build                 # 生成 lib/
#   dsh plugin --profile web add "link:$PWD"
#   （等价于在 web profile 的 package.json 加一个 link: 依赖，pnpm install，
#    reconcile 会自动把 @yhdhappy/dsh-ai-employee 加入 dsh.profile.bundles，
#    然后这份 patch 作为新的一层被应用。）

- insert:
    - id: ai-employee
      name: '@yhdhappy/dsh-ai-employee'